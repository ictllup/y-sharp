services:
  y-sharp:
    build: .
    image: y-sharp:local
    container_name: y-sharp
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      YSHARP_DATA_DIR: /data
      PORT: "8000"
    ports:
      - "${YSHARP_PORT:-8000}:8000"
    volumes:
      - ysharp_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ysharp_data:
